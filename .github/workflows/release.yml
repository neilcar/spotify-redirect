name: Release

# Push a tag vX.Y.Z (matching src/manifest.json's version) to sign the extension as an
# unlisted add-on on addons.mozilla.org and attach the signed .xpi to a GitHub Release, with an
# updates.json that installed copies poll (manifest update_url -> latest release) to auto-update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  sign:
    runs-on: spr-amd64
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tag matches manifest version
        run: npm run check-version
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Sign (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Waits up to 45 min for Mozilla's automated review, then downloads the signed .xpi.
        run: npx web-ext sign -s src -a dist --channel unlisted --approval-timeout 2700000
      - name: Name the .xpi and write updates.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          xpis=(dist/*.xpi)
          if [ "${#xpis[@]}" -ne 1 ]; then echo "expected one signed .xpi, found: ${xpis[*]}"; exit 1; fi
          mv "${xpis[0]}" "dist/spotify-redirect-${TAG#v}.xpi"
          npm run updates-json
          ls -l dist/
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # --latest: update_url reads updates.json from the latest release.
        run: |
          gh release create "$TAG" "dist/spotify-redirect-${TAG#v}.xpi" dist/updates.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --latest
